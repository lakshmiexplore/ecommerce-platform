apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: infra
  labels:
    app: zipkin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zipkin
  template:
    metadata:
      labels:
        app: zipkin
    spec:
      containers:
        - name: zipkin
          image: openzipkin/zipkin:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: JAVA_OPTS
              value: "-Xms128m -Xmx512m -XX:+ExitOnOutOfMemoryError"
            - name: STORAGE_TYPE
              value: "mem"
          ports:
            - containerPort: 9411
              name: http
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: zipkin
  namespace: infra
spec:
  type: ClusterIP
  ports:
    - port: 9411
      targetPort: 9411
      name: http
  selector:
    app: zipkin